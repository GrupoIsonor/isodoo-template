{% from 'macros/networking.jinja' import get_hostname with context -%}
http_port 3128 intercept
http_port 3129

# Filter Allowed Ports
acl allowed_ports port "/etc/squid/allowed_ports.txt"
http_access deny !allowed_ports

# Allowed lists
acl allowed_domains   dstdomain "/etc/squid/allowed_domains.txt"
acl allowed_https     dstdomain "/etc/squid/allowed_domains.txt"
acl allowed_ips       dst "/etc/squid/allowed_ips.txt"

# CONNECT method (HTTPS)
acl CONNECT method CONNECT

# CONNECT access rules
http_access allow CONNECT allowed_https
http_access allow CONNECT allowed_domains
http_access deny  CONNECT all

# HTTP + Direct IP + HTTPS SNI
http_access allow allowed_domains
http_access allow allowed_https
http_access allow allowed_ips

# Websockets
http_upgrade_request_protocols websocket allow allowed_domains
http_upgrade_request_protocols websocket allow allowed_ips
http_upgrade_request_protocols websocket deny all

# Block everything else
http_access deny all

# Disable Cache
cache deny all

# Logging
debug_options {{ cookiecutter._squid_debug_options }}

# Miscellaneous
visible_hostname {{ get_hostname('squid') }}
via off
forwarded_for off
host_verify_strict off