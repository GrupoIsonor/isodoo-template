{% from '_helpers.jinja' import ruff_pyver_map, precommit_pylint_map -%}
exclude: |
  (?x)
  # NOT INSTALLABLE ADDONS
  # END NOT INSTALLABLE ADDONS
  # Files and folders generated by bots, to avoid loops
  ^setup/|/static/description/index\.html$|
  # We don't want to mess with tool-generated files
  .svg$|/tests/([^/]+/)?cassettes/|^.copier-answers.yml$|^.github/|^eslint.config.cjs|^prettier.config.cjs|
  # Maybe reactivate this when all README files include prettier ignore tags?
  ^README\.md$|
  # Library files can have extraneous formatting (even minimized)
  /static/(src/)?lib/|
  # Repos using Sphinx to generate docs don't need prettying
  ^docs/_templates/.*\.html$|
  # Don't bother non-technical authors with formatting issues in docs
  readme/.*\.(rst|md)$|
  # Ignore build and dist directories in addons
  /build/|/dist/|
  # Ignore test files in addons
  /tests/samples/.*|
  # You don't usually want a bot to modify your legal texts
  (LICENSE.*|COPYING.*)
default_language_version:
  python: python3
  node: "{{ cookiecutter._precommit_node_version }}"
repos:
  - &maintainer_tools
    repo: https://github.com/oca/maintainer-tools
    rev: "{{ cookiecutter._precommit_maintainer_tools_rev }}"
    hooks:
      # update the NOT INSTALLABLE ADDONS section above
      - id: oca-update-pre-commit-excluded-addons
        args:
          - --addons-dir
          - private
  - repo: https://github.com/OCA/odoo-pre-commit-hooks
    rev: "{{ cookiecutter._precommit_odoo_hooks_rev }}"
    hooks:
      - id: oca-checks-odoo-module
      - id: oca-checks-po
        args: ["--fix"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "{{ cookiecutter._precommit_ruff_rev }}"
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: "{{ cookiecutter._precommit_prettier_rev }}"
    hooks:
      - id: prettier
        name: prettier + plugin-xml
        args: [--plugin=@prettier/plugin-xml]
        additional_dependencies:
          - "@prettier/plugin-xml@{{ cookiecutter._precommit_prettier_plugin_xml_version }}"
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "{{ cookiecutter._precommit_hooks_rev }}"
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: debug-statements

      - id: fix-encoding-pragma
        args: ["--remove"]

      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-symlinks
      - id: check-xml
      - id: mixed-line-ending
        args: ["--fix=lf"]
  - repo: https://github.com/OCA/pylint-odoo
    rev: "{{ precommit_pylint_map[cookiecutter.odoo_version] }}"
    hooks:
      - id: pylint_odoo
        name: pylint with optional checks
        args:
          - --rcfile=.pylintrc
          - --exit-zero
        verbose: true
      - id: pylint_odoo
        args:
          - --rcfile=.pylintrc-mandatory
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: "{{ cookiecutter._precommit_eslint_rev }}"
    hooks:
      - id: eslint
        verbose: true
        args:
          - --color
          - --fix
  - <<: *maintainer_tools
    hooks:
      # Generate readme is last, so its digest includes changes from above
      - id: oca-gen-addon-readme
        args:
          - --addons-dir=private
          - --org-name={{ cookiecutter.project_owner }}
          - --repo-name={{ cookiecutter.project_slug }}
          - --convert-fragments-to-markdown
          - --gen-html
          - --if-fragments-changed
          - --branch={{ cookiecutter.odoo_version }}
          - --template-filename=.module-readme.rst.j2
      - id: oca-fix-manifest-website
        args: ["{{ cookiecutter.project_owner_url }}"]
