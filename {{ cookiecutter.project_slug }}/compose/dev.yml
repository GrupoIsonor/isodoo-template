{% from 'macros/networking.jinja' import get_hostname with context -%}
{% from 'macros/config.jinja' import get_main_email_account with context -%}
services:
{%- if cookiecutter.__use_squid_allow | bool %}
  squid:
    extends:
      file: common.yml
      service: squid
    hostname: "{{ get_hostname('squid', 'dev') }}"
    volumes:
      - ./config/squid.conf:/etc/squid/squid.conf:ro,Z
      - ./config/squid_allowed_domains.txt:/etc/squid/allowed_domains.txt:ro,Z
      - ./config/squid_allowed_ips.txt:/etc/squid/allowed_ips.txt:ro,Z
      - ./config/squid_allowed_ports.txt:/etc/squid/allowed_ports.txt:ro,Z
      
{%- endif %}
  greenmail:
    image: greenmail/standalone:latest
    hostname: "{{ get_hostname('greenmail', 'dev') }}"
    restart: unless-stopped
    environment:
      GREENMAIL_OPTS: -Dgreenmail.users={{ cookiecutter.greenmail_users }} -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled

{%- set pgdata = "/var/lib/postgresql" if cookiecutter.postgres_version|float >= 18 else "/var/lib/postgresql/data" %}
  db:
    extends:
      file: common.yml
      service: db
    hostname: "{{ get_hostname('db', 'dev') }}"
    networks:
      - dbnet
    volumes:
      - db:{{ pgdata }}

  {% set dev_main_email_account = get_main_email_account() | from_json -%}
  odoo:
    extends:
      file: common.yml
      service: odoo
    build:
      target: isodoo-runtime-private-dev
      args:
        PUID: ${UID:-1000}
        PGID: ${GID:-1000}
    hostname: "{{ get_hostname('odoo', 'dev') }}"
    ports:
      - '127.0.0.1:{{ cookiecutter.odoo_version | int }}069:8069'
      - '127.0.0.1:{{ cookiecutter._debugpy_port }}:5678'
    networks:
      - dbnet
      - default
    env_file: 
      - env/odoo.env
    environment:
{%- if cookiecutter.__use_squid_allow | bool %}
      http_proxy: "http://{{ get_hostname('squid', 'dev') }}:3129"
      https_proxy: "http://{{ get_hostname('squid', 'dev') }}:3129"
      no_proxy: "localhost,127.0.0.1,::1,*.local,10.0.0.0/8,192.168.0.0/16"
      HTTP_PROXY: "http://{{ get_hostname('squid', 'dev') }}:3129"
      HTTPS_PROXY: "http://{{ get_hostname('squid', 'dev') }}:3129"
      NO_PROXY: "localhost,127.0.0.1,::1,*.local,10.0.0.0/8,192.168.0.0/16"
{%- endif %}
      DEBUGPY_ENABLED: ${DEBUGPY_ENABLED:-false}
      OCONF__options__log_level: debug
      OCONF__options__log_handler: ":DEBUG"
      OCONF__options__smtp_server: {{ get_hostname('greenmail', 'dev') }}
      OCONF__options__smtp_port: 3025
      OCONF__options__smtp_user: {{ dev_main_email_account.user }}
      OCONF__options__smtp_password: {{ dev_main_email_account.password }}
      OCONF__options__smtp_ssl: False
      OCONF__options__email_from: {{ dev_main_email_account.full }}
      OCONF__options__db_host: "{{ get_hostname('db', 'dev') }}"
    depends_on:
{%- if cookiecutter.__use_squid_allow | bool %}
      - squid
{%- endif %}
      - greenmail
    volumes:
      - filestore:/var/lib/odoo/filestore
      - gitaggregator:/opt/odoo/git
    develop:
      watch:
        - action: sync
          path: ./addons/private
          target: /var/lib/odoo/private
          initial_sync: true
          ignore:
            - "**/__pycache__"
            - "**/*.pyc"
            - "**/*.pyo"
            - "**/*.md"
            - "**/*.rst"
            - "**/*.txt"
            - "**/node_modules"
        - action: sync
          path: ./addons/addons.yaml
          target: /opt/odoo/addons.yaml
          initial_sync: true
        - action: sync
          path: ./addons/repos.yaml
          target: /opt/odoo/repos.yaml
          initial_sync: true
        - action: rebuild
          path: ./deps

  pgweb:
    image: sosedoff/pgweb
    hostname: "{{ get_hostname('pgweb', 'dev') }}"
    restart: unless-stopped
    networks:
      - dbnet
    ports: 
      - "127.0.0.1:{{ cookiecutter.odoo_version | int }}081:8081" 
    environment:
      PGWEB_DATABASE_URL: postgres://{{ cookiecutter.odoo_database_user }}:{{ cookiecutter._default_odoo_database_password }}@{{ get_hostname('db', 'dev') }}:5432/{{ cookiecutter.odoo_database_name }}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  roundcube:
    image: roundcube/roundcubemail:latest
    hostname: "{{ get_hostname('roundcube', 'dev') }}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:{{ cookiecutter.odoo_version | int }}090:80"
    environment:
      ROUNDCUBEMAIL_DEFAULT_HOST: {{ get_hostname('greenmail', 'dev') }}
      ROUNDCUBEMAIL_DEFAULT_PORT: 3143
      ROUNDCUBEMAIL_SMTP_SERVER: {{ get_hostname('greenmail', 'dev') }}
      ROUNDCUBEMAIL_SMTP_PORT: 3025
      ROUNDCUBEMAIL_DB_TYPE: sqlite
    depends_on:
      - greenmail

networks:
  dbnet:
    driver: bridge

volumes:
  filestore:
  db:
  gitaggregator:
    driver: local
    driver_opts:
      type: none
      device: ./addons/git
      o: bind

secrets:
  superuser_database_password:
    x-podman.relabel: Z
    file: .secrets/superuser_database_password.txt
  odoo_database_password:
    x-podman.relabel: Z
    file: .secrets/odoo_database_password.txt
