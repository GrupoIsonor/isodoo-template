{% from 'macros/networking.jinja' import get_hostname with context -%}
{% from 'macros/config.jinja' import get_main_email_account with context -%}
services:
{%- if cookiecutter.__use_squid_allow | bool %}
  squid:
    image: ubuntu/squid:latest
    hostname: "{{ get_hostname('squid', 'dev') }}"
    volumes:
      - ./compose/config/squid.conf:/etc/squid/squid.conf:ro,Z
      - ./compose/config/squid_allowed_domains.txt:/etc/squid/allowed_domains.txt:ro,Z
      - ./compose/config/squid_allowed_ips.txt:/etc/squid/allowed_ips.txt:ro,Z
      - ./compose/config/squid_allowed_ports.txt:/etc/squid/allowed_ports.txt:ro,Z
{% endif %}
  greenmail:
    image: greenmail/standalone:latest
    hostname: "{{ get_hostname('greenmail', 'dev') }}"
    restart: unless-stopped
    environment:
      GREENMAIL_OPTS: -Dgreenmail.users={{ cookiecutter.greenmail_users }} -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled

  db:
    image: ghcr.io/grupoisonor/moouro:{{ cookiecutter.postgres_version }}
    env_file: compose/env/postgres.env
    hostname: "{{ get_hostname('db', 'dev') }}"
    networks:
      - dbnet
    volumes:
      - db:{{ cookiecutter.__postgres_pgdata }}
    healthcheck:
{%- if cookiecutter.odoo_version|float < 19 %}
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_ODOO_USER -d $$POSTGRES_ODOO_DB"]
{%- else %}
      test: ["CMD-SHELL", "pg_isready"]
{%- endif %}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  {% set dev_main_email_account = get_main_email_account() | from_json -%}
  odoo:
    build:
      context: ./compose
      additional_contexts:
        deps: ./deps
        addons: ./addons
      target: isodoo-runtime-private-dev
      args:
        PUID: ${UID:-1000}
        PGID: ${GID:-1000}
    depends_on:
      db:
        condition: service_healthy
{%- if cookiecutter.__use_squid_allow | bool %}
      squid:
        condition: service_started
{%- endif %}
      greenmail:
        condition: service_started
    hostname: "{{ get_hostname('odoo', 'dev') }}"
    ports:
      - '{{ cookiecutter._bind_ip }}:{{ cookiecutter.odoo_version | int }}069:8069'
      - '{{ cookiecutter._bind_ip }}:{{ cookiecutter._debugpy_port }}:5678'
    networks:
      - dbnet
      - default
    env_file:
      - compose/env/odoo.env
    environment:
{%- if cookiecutter.__use_squid_allow | bool %}
      http_proxy: &http_proxy "http://{{ get_hostname('squid', 'dev') }}:3129"
      https_proxy: *http_proxy
      no_proxy: &no_proxy "{{ cookiecutter._squid_no_proxy }}"
      HTTP_PROXY: *http_proxy
      HTTPS_PROXY: *http_proxy
      NO_PROXY: *no_proxy
{%- endif %}
      DEBUGPY_ENABLED: ${DEBUGPY_ENABLED:-false}
      ODOO_DEV_MODES: ${ODOO_DEV_MODES:-all}
      OCONF__options__log_level: debug
      OCONF__options__log_handler: ":DEBUG"
      OCONF__options__smtp_server: "{{ get_hostname('greenmail', 'dev') }}"
      OCONF__options__smtp_port: 3025
      OCONF__options__smtp_user: "{{ dev_main_email_account.user }}"
      OCONF__options__smtp_password: "{{ dev_main_email_account.password }}"
      OCONF__options__smtp_ssl: False
      OCONF__options__email_from: "{{ dev_main_email_account.full }}"
      OCONF__options__db_host: "{{ get_hostname('db', 'dev') }}"
      OCONF__options__admin_passwd: "{{ cookiecutter.odoo_admin_passwd }}"
    volumes:
      - filestore:/var/lib/odoo/data
      - gitaggregator:/opt/odoo/git
    develop:
      watch:
        - action: sync
          path: ./addons/private
          target: /var/lib/odoo/private
          initial_sync: true
          ignore:
            - "**/__pycache__"
            - "**/*.pyc"
            - "**/*.pyo"
            - "**/*.md"
            - "**/*.rst"
            - "**/*.txt"
            - "**/node_modules"
        - action: sync
          path: ./addons/addons.yaml
          target: /opt/odoo/addons.yaml
          initial_sync: true
        - action: sync
          path: ./addons/repos.yaml
          target: /opt/odoo/repos.yaml
          initial_sync: true
        - action: rebuild
          path: ./deps
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8069/web/login || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s

  pgweb:
    image: sosedoff/pgweb
    hostname: "{{ get_hostname('pgweb', 'dev') }}"
    restart: unless-stopped
    networks:
      - dbnet
    ports:
      - "{{ cookiecutter._bind_ip }}:{{ cookiecutter.odoo_version | int }}081:8081"
    environment:
      PGWEB_DATABASE_URL: postgres://{{ cookiecutter.odoo_db_user }}:{{ cookiecutter.odoo_db_password }}@{{ get_hostname('db', 'dev') }}:5432/{{ cookiecutter.odoo_db_name }}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  roundcube:
    image: roundcube/roundcubemail:latest
    hostname: "{{ get_hostname('roundcube', 'dev') }}"
    restart: unless-stopped
    ports:
      - "{{ cookiecutter._bind_ip }}:{{ cookiecutter.odoo_version | int }}090:80"
    environment:
      ROUNDCUBEMAIL_DEFAULT_HOST: "{{ get_hostname('greenmail', 'dev') }}"
      ROUNDCUBEMAIL_DEFAULT_PORT: 3143
      ROUNDCUBEMAIL_SMTP_SERVER: "{{ get_hostname('greenmail', 'dev') }}"
      ROUNDCUBEMAIL_SMTP_PORT: 3025
      ROUNDCUBEMAIL_DB_TYPE: sqlite
    depends_on:
      - greenmail

networks:
  default:
  dbnet:
    driver: bridge

volumes:
  filestore:
  db:
  gitaggregator:
    driver: local
    driver_opts:
      type: none
      device: ./addons/git
      o: bind
